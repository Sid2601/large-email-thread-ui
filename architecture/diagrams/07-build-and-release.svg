<rect x="780" y="204" width="640" height="54" rx="10" ry="10" fill="#ffffff" stroke="rgba(196,102,63,0.55)" stroke-width="1.5"/><path d="M781.5 215 a9.5 9.5 0 0 1 9.5 -9.5 h0 v51 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#c4663f"/><rect x="781.5" y="205.5" width="6" height="51" fill="#c4663f" opacity="0.9"/><text x="798" y="226" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">2 · tests</text><text x="798" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">251 assertions (vitest, jsdom)</text>
<path d="M1100 259 V270" fill="none" stroke="#c4663f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-c4663f)"/>
<rect x="780" y="272" width="640" height="54" rx="10" ry="10" fill="#ffffff" stroke="rgba(196,102,63,0.55)" stroke-width="1.5"/><path d="M781.5 283 a9.5 9.5 0 0 1 9.5 -9.5 h0 v51 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#c4663f"/><rect x="781.5" y="273.5" width="6" height="51" fill="#c4663f" opacity="0.9"/><text x="798" y="294" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">3 · build</text><text x="798" y="314" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">vite build --mode development | production</text>
<path d="M1100 327 V338" fill="none" stroke="#c4663f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-c4663f)"/>
<rect x="780" y="340" width="640" height="54" rx="10" ry="10" fill="#ffffff" stroke="rgba(196,102,63,0.55)" stroke-width="1.5"/><path d="M781.5 351 a9.5 9.5 0 0 1 9.5 -9.5 h0 v51 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#c4663f"/><rect x="781.5" y="341.5" width="6" height="51" fill="#c4663f" opacity="0.9"/><text x="798" y="362" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">4 · package</text><text x="798" y="382" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">scripts/package-release.py inspects the emitted bundle</text>
<path d="M1100 395 V406" fill="none" stroke="#c4663f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-c4663f)"/>
<rect x="780" y="408" width="640" height="54" rx="10" ry="10" fill="#ffffff" stroke="rgba(196,102,63,0.55)" stroke-width="1.5"/><path d="M781.5 419 a9.5 9.5 0 0 1 9.5 -9.5 h0 v51 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#c4663f"/><rect x="781.5" y="409.5" width="6" height="51" fill="#c4663f" opacity="0.9"/><text x="798" y="430" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">5 · publish locally</text><text x="798" y="450" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">versioned ZIP + extracted folder + INSTALL.txt + SHA-256</text>
<text x="780" y="478" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b4453f" text-anchor="start">Any failing step stops the pipeline — nothing is released.</text>
<rect x="40" y="530" width="1400" height="194" rx="14" ry="14" fill="rgba(122,85,166,0.05)" stroke="rgba(122,85,166,0.45)" stroke-width="1.4" stroke-dasharray="7 5"/><text x="56" y="554" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7a55a6" text-anchor="start" letter-spacing="1.1">C · WHAT THE PACKAGER AND THE SUITES ACTUALLY CHECK</text>
<rect x="60" y="566" width="440" height="124" rx="10" ry="10" fill="#ffffff" stroke="rgba(122,85,166,0.55)" stroke-width="1.5"/><path d="M61.5 577 a9.5 9.5 0 0 1 9.5 -9.5 h0 v121 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#7a55a6"/><rect x="61.5" y="567.5" width="6" height="121" fill="#7a55a6" opacity="0.9"/><text x="78" y="588" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">Packaging refuses to write a ZIP when…</text><text x="78" y="608" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">the production bundle still contains an export control</text><text x="78" y="625" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">or the diagnostic capture request</text><text x="78" y="642" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">either bundle is missing the attachment controls</text><text x="78" y="659" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">the manifest version disagrees with package.json</text><text x="78" y="676" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">a declared icon, page or script is missing from the build</text>
<rect x="520" y="566" width="440" height="124" rx="10" ry="10" fill="#ffffff" stroke="rgba(122,85,166,0.55)" stroke-width="1.5"/><path d="M521.5 577 a9.5 9.5 0 0 1 9.5 -9.5 h0 v121 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#7a55a6"/><rect x="521.5" y="567.5" width="6" height="121" fill="#7a55a6" opacity="0.9"/><text x="538" y="588" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">Automated suites (tests/)</text><text x="538" y="608" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">verify · regressions · enterprise-cases · reader-adapters</text><text x="538" y="625" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">expansion-stability · participant-identity · inline-images</text><text x="538" y="642" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">image-download · conversation-export · masked-export</text><text x="538" y="659" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">reader-order · thread-source-capture · capture-file</text><text x="538" y="676" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">all fixtures are synthetic — no customer mail is committed</text>
<rect x="980" y="566" width="460" height="124" rx="10" ry="10" fill="#ffffff" stroke="rgba(122,85,166,0.55)" stroke-width="1.5"/><path d="M981.5 577 a9.5 9.5 0 0 1 9.5 -9.5 h0 v121 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#7a55a6"/><rect x="981.5" y="567.5" width="6" height="121" fill="#7a55a6" opacity="0.9"/><text x="998" y="588" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">Browser checks (Playwright + Chromium)</text><text x="998" y="608" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">smoke-packages.mjs loads both delivered folders and drives</text><text x="998" y="625" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">them against synthetic Gmail: images, tables, search,</text><text x="998" y="642" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">attachments (save, reload, download, remove, import),</text><text x="998" y="659" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">and proves the production package exposes no export path</text><text x="998" y="676" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">smoke-extension.mjs covers the wider dev flow</text>
<text x="44" y="774" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a3b6" text-anchor="start">Releases are local artefacts: releases/threadlens-&lt;version&gt;-&lt;flavour&gt;.zip, an already-extracted folder for Load unpacked, and SHA256SUMS.txt. Nothing is uploaded anywhere.</text>
<text x="44" y="800" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a3b6" text-anchor="start">Node 22 or newer and Python 3 are required; the release script re-runs itself on an nvm-installed Node 22 when the shell default is older.</text>
</svg>