<text x="44" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#16222e" text-anchor="start">ThreadLens — build flavours, release gate and what guards the product</text><text x="44" y="81" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4a5a6e" text-anchor="start">One source tree, two packages; the difference is chosen at build time and the code for the other flavour is not emitted</text>
<rect x="40" y="100" width="700" height="400" rx="14" ry="14" fill="rgba(63,116,176,0.05)" stroke="rgba(63,116,176,0.45)" stroke-width="1.4" stroke-dasharray="7 5"/><text x="56" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#3f74b0" text-anchor="start" letter-spacing="1.1">A · TWO PACKAGES FROM ONE SOURCE</text>
<rect x="60" y="136" width="320" height="124" rx="10" ry="10" fill="#ffffff" stroke="rgba(63,116,176,0.55)" stroke-width="1.5"/><path d="M61.5 147 a9.5 9.5 0 0 1 9.5 -9.5 h0 v121 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#3f74b0"/><rect x="61.5" y="137.5" width="6" height="121" fill="#3f74b0" opacity="0.9"/><text x="78" y="158" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">ThreadLens Dev  ·  dist-dev/</text><text x="78" y="178" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">__DEV_TOOLS__ = true</text><text x="78" y="195" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">conversation export · masked copy</text><text x="78" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">thread-source capture (both copies)</text><text x="78" y="229" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">replay + fidelity reporting</text><text x="78" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">attachments, images, search, all of it</text>
<rect x="400" y="136" width="320" height="124" rx="10" ry="10" fill="#ffffff" stroke="rgba(63,143,116,0.55)" stroke-width="1.5"/><path d="M401.5 147 a9.5 9.5 0 0 1 9.5 -9.5 h0 v121 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#3f8f74"/><rect x="401.5" y="137.5" width="6" height="121" fill="#3f8f74" opacity="0.9"/><text x="418" y="158" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">ThreadLens  ·  dist/</text><text x="418" y="178" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">__DEV_TOOLS__ = false</text><text x="418" y="195" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">no export UI, no masking code,</text><text x="418" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">no CAPTURE_THREAD_SOURCE handler</text><text x="418" y="229" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">attachments, images, search, history</text><text x="418" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">recovery — all present and unchanged</text>
<rect x="60" y="316" width="660" height="107" rx="10" ry="10" fill="#ffffff" stroke="rgba(90,106,125,0.55)" stroke-width="1.5"/><path d="M61.5 327 a9.5 9.5 0 0 1 9.5 -9.5 h0 v104 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#5a6a7d"/><rect x="61.5" y="317.5" width="6" height="104" fill="#5a6a7d" opacity="0.9"/><text x="78" y="338" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">The switch</text><text x="78" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">vite.config.ts: devTools = (mode === "development")   →   define __DEV_TOOLS__ and __APP_VERSION__</text><text x="78" y="375" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">import.meta.env.DEV is false for both optimised builds, so it is never used for this decision</text><text x="78" y="392" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">dead-code elimination removes the other flavour entirely — there is no runtime toggle to flip</text><text x="78" y="409" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">manifest name, output folder and package name all follow from the same flag</text>
<rect x="760" y="100" width="680" height="400" rx="14" ry="14" fill="rgba(196,102,63,0.05)" stroke="rgba(196,102,63,0.45)" stroke-width="1.4" stroke-dasharray="7 5"/><text x="776" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c4663f" text-anchor="start" letter-spacing="1.1">B · RELEASE GATE — NPM RUN PACKAGE:DEV | PACKAGE:PROD</text>
<rect x="780" y="136" width="640" height="54" rx="10" ry="10" fill="#ffffff" stroke="rgba(196,102,63,0.55)" stroke-width="1.5"/><path d="M781.5 147 a9.5 9.5 0 0 1 9.5 -9.5 h0 v51 h0 a9.5 9.5 0 0 1 -9.5 -9.5 z" fill="#c4663f"/><rect x="781.5" y="137.5" width="6" height="51" fill="#c4663f" opacity="0.9"/><text x="798" y="158" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#16222e" text-anchor="start">1 · typecheck</text><text x="798" y="178" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a5a6e" text-anchor="start">tsc --noEmit</text>
