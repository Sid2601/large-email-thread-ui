<rect x="30" y="998" width="1500" height="74" rx="10" ry="10" fill="#ffffff" stroke="#d7e0ec" stroke-width="1.4"/>
<text x="46" y="1026" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#16222e" text-anchor="start">Invalidation</text>
<text x="150" y="1026" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5a6e" text-anchor="start">hashchange · popstate · a new thread id  →  revision++, snapshot WeakMap dropped, CLEAR_THREAD sent.    Tab navigating  →  session entry removed, THREAD_CLEARED.</text>
<text x="150" y="1048" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5a6e" text-anchor="start">Tab closed  →  PARSER_DROP evicts the parser cache.    A batch that fails is re-queued at most twice, and nothing partial is ever cached or shown.</text>
<text x="44" y="1092" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a3b6" text-anchor="start">Everything above happens inside the browser. The only outbound requests are to the provider and image hosts, made by the panel on the user’s behalf.</text>
</svg>